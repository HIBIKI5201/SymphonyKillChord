name: "[Git] AutoCreateMasterBranch"

on:
  create:

jobs:
  auto-create-master-branch:
    runs-on: ubuntu-latest
    # feature ブランチ作成のみトリガー。タグの作成では動かさない。
    if: github.event.ref_type == 'branch' && startsWith(github.ref_name, 'feature/')

    permissions:
      contents: write  # ブランチ作成に必要な権限。

    steps:
      - name: Validate conditions
        id: validate
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          BR="${BRANCH_NAME}"

          skip() {
            echo "Conditions not met. Skipping branch creation: $1"
            echo "::notice::master を作りません: $1"
            echo "pass=false" >> $GITHUB_OUTPUT
            exit 0
          }

          # 1. root が feature であること。
          case "$BR" in
            feature/*) ;;
            *) skip "root is not feature" ;;
          esac

          # 2. ディレクトリ階層が4層以上であること（/ が 3 つ以上）
          SLASH_COUNT=$(echo "$BR" | grep -o "/" | wc -l)
          if [ "$SLASH_COUNT" -lt 3 ]; then
            skip "less than 4 directory levels"
          fi

          # 3. 最下層が master でないこと。
          LAST=$(basename "$BR")
          if [ "$LAST" = "master" ]; then
            skip "last directory name is master"
          fi

          TARGET_BRANCH="$(dirname "$BR")/master"
          echo "Conditions passed. Target branch: $TARGET_BRANCH"
          echo "pass=true" >> $GITHUB_OUTPUT
          echo "target=$TARGET_BRANCH" >> $GITHUB_OUTPUT

      # 生成元は create イベント時点のコミット（github.sha）に固定する。
      # 以前は 10 秒待ってから最新の SHA を取っていたため、空 push の直後に変更を push すると
      # master が変更済みのコミットになり、作業ブランチと同一コミットになることがあった。
      - name: Create new branch
        if: ${{ steps.validate.outputs.pass == 'true' }}
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: ${{ steps.validate.outputs.target }}
          SOURCE_SHA: ${{ github.sha }}
        with:
          script: |
            const target = process.env.TARGET_BRANCH;
            const sha = process.env.SOURCE_SHA;
            const repo = context.repo;

            try {
              await github.rest.git.createRef({
                owner: repo.owner,
                repo: repo.repo,
                ref: "refs/heads/" + target,
                sha: sha,
              });
              console.log(`Created branch: ${target} (${sha})`);
            } catch (e) {
              if (e.status !== 422) throw e;

              // 422 は「既に存在する」以外の検証エラーでも返るため、実際に存在するかを確かめる。
              // 既存の master は上書きしない。
              let existing;
              try {
                existing = await github.rest.repos.getBranch({ owner: repo.owner, repo: repo.repo, branch: target });
              } catch (getError) {
                if (getError.status === 404) {
                  core.setFailed(`master を作れませんでした（422）: ${e.message}`);
                  return;
                }
                throw getError;
              }
              core.notice(`既に存在するため作りません: ${target} (${existing.data.commit.sha})`);
            }
