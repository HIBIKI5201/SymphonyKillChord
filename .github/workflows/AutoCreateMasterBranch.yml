name: AutoCreateMasterBranch

on:
  create:

jobs:
  auto-create-master-branch:
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'feature/') # feature ブランチ作成のみトリガー。

    permissions:
      contents: write  # ブランチ作成に必要な権限。
      pull-requests: write  # develop向けDraft PRの作成に必要な権限。

    steps:
      - name: Extract original branch name
        run: |
          echo "BRANCH_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Validate conditions
        id: validate
        run: |
          BR="${BRANCH_NAME}"

          # 1. root が feature であること。
          case "$BR" in
            feature/*) ;;
            *)
              echo "Invalid: root is not feature"
              echo "pass=false" >> $GITHUB_OUTPUT
              exit 0
              ;;
          esac

          # 2. ディレクトリ階層が4層以上であること（/ が 3 つ以上）
          SLASH_COUNT=$(echo "$BR" | grep -o "/" | wc -l)
          if [ "$SLASH_COUNT" -lt 3 ]; then
            echo "Invalid: less than 4 directory levels"
            echo "pass=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 3. 最下層が master でないこと。
          LAST=$(basename "$BR")
          if [ "$LAST" = "master" ]; then
            echo "Invalid: last directory name is master"
            echo "pass=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Conditions passed"
          echo "pass=true" >> $GITHUB_OUTPUT

      - name: Stop if conditions not met
        if: ${{ steps.validate.outputs.pass != 'true' }}
        run: echo "Conditions not met. Skipping branch creation." && exit 0

        # ユーザーの更新が終わるまで待機する。
      - name: Wait User Update
        run: sleep 10

      - name: Build target branch name
        run: |
          ORG="${BRANCH_NAME}"
          DIR_PATH=$(dirname "$ORG")
          TARGET_BRANCH="${DIR_PATH}/master"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV
          echo "Target branch: $TARGET_BRANCH"

      # 元ブランチの最新 commit SHA を取得。
      - name: Get latest commit SHA
        id: sha
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        with:
          script: |
            const branch = process.env.BRANCH_NAME;
            const repo = context.repo;

            const res = await github.rest.repos.getBranch({
              owner: repo.owner,
              repo: repo.repo,
              branch: branch,
            });

            // commit sha を result として返す。
            return res.data.commit.sha;

      # 新しい master ブランチを作成。
      - name: Create new branch
        id: create-branch
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
        with:
          script: |
            const target = process.env.TARGET_BRANCH;
            const sha = ${{ steps.sha.outputs.result }};
            const repo = context.repo;

            try {
              await github.rest.git.createRef({
                owner: repo.owner,
                repo: repo.repo,
                ref: "refs/heads/" + target,
                sha: sha,
              });
              console.log("Created branch: " + target);
              core.setOutput("created", "true");
            } catch (e) {
              if (e.status === 422) {
                console.log("Branch already exists: " + target);
                core.setOutput("created", "false");
              } else {
                throw e;
              }
            }

      # 作成したmasterブランチからdevelopへDraft PRを作成。
      - name: Create draft pull request to develop
        if: steps.create-branch.outputs.created == 'true'
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
        with:
          script: |
            const head = process.env.TARGET_BRANCH;
            const base = "develop";
            const repo = context.repo;

            const existingPullRequests = await github.rest.pulls.list({
              owner: repo.owner,
              repo: repo.repo,
              head: `${repo.owner}:${head}`,
              base: base,
              state: "open",
            });

            if (existingPullRequests.data.length > 0) {
              console.log(`Pull request already exists: ${existingPullRequests.data[0].html_url}`);
              return;
            }

            const body = `## 必須チェック（未チェックのPRは提出しないでください）
            - [ ] コンパイルエラーが無いことを確認した
            - [ ] 変更が関係しうるシーンでPlayModeを最低1回通した

            ## 概要
            ${head} の変更を develop に取り込むための自動生成Draft PRです。

            ## 原因
            なし。

            ## 対処
            feature配下の作業ブランチを同階層のmasterへ集約し、運用規定に従ってdevelopへ取り込みます。

            ## 確認済みの内容
            - GitHub ActionsによりDraft PRが自動生成されたこと。

            ## 未確認・残論点
            - コンパイルおよびPlayModeでの動作確認は未実施です。

            ご確認いただけますと幸いです。`;

            try {
              const pullRequest = await github.rest.pulls.create({
                owner: repo.owner,
                repo: repo.repo,
                title: `${head} → develop`,
                head: head,
                base: base,
                body: body,
                draft: true,
              });
              console.log(`Created draft pull request: ${pullRequest.data.html_url}`);
            } catch (e) {
              if (e.status === 422) {
                console.log(`Draft pull request was not created: ${e.message}`);
                return;
              }

              throw e;
            }
