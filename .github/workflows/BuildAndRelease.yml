name: Unity Build and Release

on:
  pull_request:
    branches:
      - develop
    types: [closed]

permissions:
  contents: write      # リリース作成のために必要

jobs:
  build-and-release:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted
    timeout-minutes: 120  # ビルド処理が長くなる可能性があるため、タイムアウトを設定

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Execute Unity - Download Assets and Build
        # Unity 6のインストールパスは環境に応じて変更してください
        # このステップで以下の処理が自動で実行されます：
        # 1. GoogleDriveBatchCI.StartBatchImport でGoogle Driveからアセットをダウンロード
        # 2. アセットインポート完了後、自動的にAutoBuilderでビルド開始
        run: |
          Write-Host "Using UNITY_EXE_PATH: $env:UNITY_EXE_PATH"
          & "$env:UNITY_EXE_PATH" -batchmode -quit -projectPath "${{ github.workspace }}" -executeMethod "KillChord.Editor.AssetImporter.GoogleDriveBatchCI.StartBatchImport" -logFile "unity_build.log"
        shell: powershell
        env:
          # Unity 実行ファイルパスを GitHub Secrets から取得
          UNITY_EXE_PATH: ${{ secrets.UNITY_EXE_PATH }}
          # Google Drive API認証情報（GitHub Secrets から取得）
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

      - name: Upload Unity Log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unity-build-log
          path: unity_build.log

      - name: Check Build Output
        run: |
          if (Test-Path "Builds") {
            Write-Host "Build artifacts found in Builds directory"
            Get-ChildItem -Path "Builds" -Recurse | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "WARNING: No Builds directory found"
          }
        shell: powershell

      - name: Zip Build Artifacts
        run: |
          if (Test-Path "Builds") {
            Compress-Archive -Path Builds\* -DestinationPath Builds.zip
            Write-Host "Build artifacts compressed successfully"
          } else {
            Write-Host "ERROR: Builds directory not found, cannot create archive"
            exit 1
          }
        shell: powershell

      - name: Generate Release Tag
        id: tag_gen
        run: echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.tag_gen.outputs.TAG_NAME }}
          name: Release ${{ steps.tag_gen.outputs.TAG_NAME }}
          body: |
            Automated build generated by merging PR #${{ github.event.pull_request.number }} into develop.
            
            **Build Process:**
            1. Assets downloaded from Google Drive
            2. Unity packages imported automatically
            3. Multi-profile builds executed
            
            **Included Builds:**
            - Development profiles
            - Master profiles
          files: Builds.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}