name: Unity Build and Release

# このワークフローは PR のマージ（develop ブランチ）または手動実行で
# Unity ビルドを実行し、成果物をリリースとしてアップロードします。

on:
  pull_request:
    branches:
      - develop
    types: [closed]

  workflow_dispatch:       # 手動実行も可能。

permissions:
  contents: write      # リリース作成とリポジトリ参照に必要な最小権限

# 注意: アーティファクトアップロードや他の操作が必要な場合、
# permissions を追加で緩和する必要があるか確認してください。

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.release_age.outputs.should_run }}
      days: ${{ steps.release_age.outputs.days }}

    steps:
      - name: Check latest release age
        id: release_age
        run: |
          # 最新リリースの公開日を取得し、経過日数を算出します。
          # github.token を使うことでシークレット準備は不要です。
          set -e
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}/releases/latest")
          RELEASE_DATE=$(echo "$RESPONSE" | jq -r '.published_at // empty')

          if [ -z "$RELEASE_DATE" ]; then
            echo "No release found or could not fetch release date; will run build"
            echo "days=999" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          RELEASE_TS=$(date -d "$RELEASE_DATE" +%s)
          NOW_TS=$(date -u +%s)
          DAYS=$(( (NOW_TS - RELEASE_TS) / 86400 ))

          echo "days=$DAYS" >> $GITHUB_OUTPUT
          if [ "$DAYS" -le 3 ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  build-and-release:
    needs: check
    if: needs.check.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true)
    runs-on: self-hosted
    timeout-minutes: 120  # ビルド処理が長くなる可能性があるため、タイムアウトを設定
    environment: 'AutoBuildAndRelease'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Execute Unity - Download Assets and Build
        # Unity 6のインストールパスは環境に応じて変更してください
        # このステップで以下の処理が自動で実行されます：
        # 1. GoogleDriveBatchCI.StartBatchImport でGoogle Driveからアセットをダウンロード
        # 2. アセットインポート完了後、自動的にAutoBuilderでビルド開始
        run: |
          # UNITY_EXE_PATH は runner またはリポジトリシークレットで指定してください。
          # 例: Secrets に UNITY_EXE_PATH を登録するか、self-hosted runner の環境変数に設定します。
          Write-Host "Using UNITY_EXE_PATH: $env:UNITY_EXE_PATH"
          & "$env:UNITY_EXE_PATH" -batchmode -quit -projectPath "${{ github.workspace }}" -executeMethod "KillChord.Editor.AssetImporter.GoogleDriveBatchCI.StartBatchImport" -logFile "unity_build.log"
        shell: powershell
        env:
          # Unity 実行ファイルパスを GitHub Secrets から取得
          UNITY_EXE_PATH: ${{ secrets.UNITY_EXE_PATH }}
          # Google Drive API認証情報（GitHub Secrets から取得）
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

      - name: Upload Unity Log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unity-build-log
          path: unity_build.log

      # ビルド成果物（Builds.zip）は後で Release に添付されます。

      - name: Check Build Output
        run: |
          if (Test-Path "Builds") {
            Write-Host "Build artifacts found in Builds directory"
            Get-ChildItem -Path "Builds" -Recurse | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "WARNING: No Builds directory found"
          }
        shell: powershell

      - name: Zip Build Artifacts
        run: |
          if (Test-Path "Builds") {
            Compress-Archive -Path Builds\* -DestinationPath Builds.zip
            Write-Host "Build artifacts compressed successfully"
          } else {
            Write-Host "ERROR: Builds directory not found, cannot create archive"
            exit 1
          }
        shell: powershell

      - name: Generate Release Tag
        id: tag_gen
        run: echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.tag_gen.outputs.TAG_NAME }}
          name: Release ${{ steps.tag_gen.outputs.TAG_NAME }}
          body: |
            Automated build generated by merging PR #${{ github.event.pull_request.number }} into develop.
            
            **Build Process:**
            1. Assets downloaded from Google Drive
            2. Unity packages imported automatically
            3. Multi-profile builds executed
            
            **Included Builds:**
            - Development profiles
            - Master profiles
          files: Builds.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}