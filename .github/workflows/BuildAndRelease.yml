name: Unity Build and Release

on:
  pull_request:
    branches:
      - develop
    types: [closed]

jobs:
  build-and-release:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Unity 6 Builds
        # Unity 6のインストールパスに書き換えること
        run: |
          "C:\Program Files\Unity\Hub\Editor\6000.3.10f1\Editor\Unity.exe" `
            -batchmode `
            -quit `
            -projectPath "${{ github.workspace }}" `
            -executeMethod "AutoBuilder.PerformMultipleBuilds" `
            -logFile "unity_build.log"
        shell: powershell

      - name: Upload Unity Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-build-log
          path: unity_build.log

      - name: Zip Build Artifacts
        run: |
          Compress-Archive -Path Builds\* -DestinationPath Builds.zip
        shell: powershell

      - name: Generate Release Tag
        id: tag_gen
        run: echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_gen.outputs.TAG_NAME }}
          name: Release ${{ steps.tag_gen.outputs.TAG_NAME }}
          body: |
            Automated build generated by merging PR #${{ github.event.pull_request.number }} into develop.
          files: Builds.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}