name: Unity Build and Release

# このワークフローは PR のマージ（develop ブランチ）または手動実行で
# Unity ビルドを実行し、成果物をリリースとしてアップロードします。

on:
  pull_request:
    branches:
      - develop
    types: [ closed ]

  workflow_dispatch:       # 手動実行も可能。

permissions:
  contents: write      # リリース作成とリポジトリ参照に必要な最小権限

# 注意: アーティファクトアップロードや他の操作が必要な場合、
# permissions を追加で緩和する必要があるか確認してください。

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.release_age.outputs.should_run }}
      days: ${{ steps.release_age.outputs.days }}

    steps:
      - name: Check latest release age
        id: release_age
        run: |
          set -e
          echo "========== Release Age Check =========="
          echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Starting release age validation..."
          echo "Trigger Event: ${GITHUB_EVENT_NAME}"
          echo "Repository: ${{ github.repository }}"
          echo "==========================================="

          # Skip the release-age check when the workflow is manually dispatched to avoid unnecessary API calls.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "[SKIP] Manual dispatch detected (workflow_dispatch); bypassing release age check"
            echo "days=0" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "[SUCCESS] Decision: should_run=true (manual trigger)"
            exit 0
          fi

          # Fetch latest release from GitHub API
          echo "[INFO] Fetching latest release from GitHub API..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}/releases/latest")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          RESPONSE=$(echo "$RESPONSE" | head -n -1)
          
          if [ "$HTTP_CODE" = "404" ]; then
            echo "[INFO] No previous release found"
            echo "days=999" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "[SUCCESS] Decision: should_run=true (no release found)"
            exit 0
          elif [ "$HTTP_CODE" != "200" ]; then
            echo "[ERROR] GitHub API returned HTTP $HTTP_CODE"
            exit 1
          fi

          RELEASE_DATE=$(echo "$RESPONSE" | jq -r '.published_at // empty')
          if [ -z "$RELEASE_DATE" ]; then
            echo "[INFO] No release date found in response"
            echo "days=999" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "[SUCCESS] Decision: should_run=true (no release found)"
            exit 0
          fi
          
          echo "[INFO] Latest release published at: $RELEASE_DATE"
          RELEASE_TS=$(date -d "$RELEASE_DATE" +%s)
          NOW_TS=$(date -u +%s)
          DAYS=$(( (NOW_TS - RELEASE_TS) / 86400 ))
          
          echo "[INFO] Days since last release: $DAYS days"
          echo "[INFO] Threshold: 3 days (releases within 3 days are skipped)"
          
          echo "days=$DAYS" >> $GITHUB_OUTPUT
          if [ "$DAYS" -le 3 ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "[DECISION] should_run=false (last release was $DAYS days ago <= 3 day threshold)"
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "[DECISION] should_run=true (last release was $DAYS days ago > 3 day threshold)"
          fi

  build-and-release:
    needs: check
    if: needs.check.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true)
    runs-on: self-hosted
    timeout-minutes: 120  # ビルド処理が長くなる可能性があるため、タイムアウトを設定
    environment: 'AutoBuildAndRelease'
    # ジョブ全体で利用する環境変数
    env:
      GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      UNITY_BUILD_OUTPUT_DIR: ${{ secrets.UNITY_BUILD_OUTPUT_DIR || 'Builds' }}
      UNITY_EXE_PATH: ${{ secrets.UNITY_EXE_PATH }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Display Environment Information
        run: |
          Write-Host "::group::ビルドワークフロー実行環境情報"
          Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')] ワークフローを開始しました。"
          Write-Host "Runner: ${{ runner.os }} (アーキテクチャ: ${{ runner.arch }})"
          Write-Host "Project Path: ${{ github.workspace }}"
          Write-Host ""
          Write-Host "Google Drive API Key 設定状況: $(if ($env:GOOGLE_DRIVE_API_KEY) { '設定済み' } else { '未設定' })"
          Write-Host "Google Drive Folder ID 設定状況: $(if ($env:GOOGLE_DRIVE_FOLDER_ID) { '設定済み' } else { '未設定' })"
          Write-Host "Build Output Directory: $env:UNITY_BUILD_OUTPUT_DIR"
          Write-Host "Unity EXE Path: $env:UNITY_EXE_PATH"
          Write-Host "::endgroup::"
        shell: powershell

      - name: Validate Unity Installation
        run: |
          Write-Host "::group::Unityインストールの確認"
          if (-not $env:UNITY_EXE_PATH) {
            Write-Host "[ERROR] UNITY_EXE_PATH が設定されていません。"
            Write-Host "::endgroup::"
            exit 1
          }
          Write-Host "UNITY_EXE_PATH: $env:UNITY_EXE_PATH"
          
          if (Test-Path $env:UNITY_EXE_PATH) {
            $FileInfo = Get-Item $env:UNITY_EXE_PATH
            Write-Host "[OK] Unityの実行ファイルを確認しました。"
            Write-Host "      ファイルサイズ: $($FileInfo.Length / 1MB) MB"
            Write-Host "      最終更新日時: $($FileInfo.LastWriteTime)"
          } else {
            Write-Host "[ERROR] 指定されたパスにUnityの実行ファイルが見つかりません: $env:UNITY_EXE_PATH"
            Write-Host "::endgroup::"
            exit 1
          }
          Write-Host "::endgroup::"
        shell: powershell

      - name: Execute Unity - Download Assets and Build
        # このステップで以下の処理が自動で実行されます：
        # 1. GoogleDriveBatchCI.StartBatchImport でGoogle Driveからアセットをダウンロード
        # 2. アセットインポート完了後、自動的にAutoBuilderでビルド開始
        run: |
          Write-Host "::group::Unityビルド処理の開始"
          Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')] Unityを起動中..."
          Write-Host "実行メソッド: KillChord.Editor.AssetImporter.GoogleDriveBatchCI.StartBatchImport"
          Write-Host "ログ出力先: unity_build.log"
          Write-Host ""
          
          & "$env:UNITY_EXE_PATH" -batchmode -projectPath "${{ github.workspace }}" -executeMethod "KillChord.Editor.AssetImporter.GoogleDriveBatchCI.StartBatchImport" -logFile "unity_build.log"
          
          $UnityExitCode = $LASTEXITCODE
          Write-Host ""
          Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')] Unityプロセスが終了コード $UnityExitCode で終了しました。"
          
          if ($UnityExitCode -eq 0) {
            Write-Host "[OK] Unityビルド処理が正常に完了しました。"
          } else {
            Write-Host "[WARNING] Unityプロセスが非ゼロの終了コード ($UnityExitCode) を返しました。"
            Write-Host "          ビルドエラーが発生した可能性があります。詳細は unity_build.log を確認してください。"
          }
          Write-Host "::endgroup::"
          exit $UnityExitCode
        shell: powershell

      - name: Extract Unity Build Log Summary
        if: always()
        run: |
          Write-Host "::group::Unityビルドログのサマリー出力"
          if (Test-Path "unity_build.log") {
            Write-Host "[INFO] unity_build.log から主要な情報を抽出しています..."
            Write-Host ""
          
            # エラーと警告をカウント
            $Errors = Select-String -Path "unity_build.log" -Pattern "error|failed" -ErrorAction SilentlyContinue | Measure-Object | Select-Object -ExpandProperty Count
            $Warnings = Select-String -Path "unity_build.log" -Pattern "warning" -ErrorAction SilentlyContinue | Measure-Object | Select-Object -ExpandProperty Count
          
            Write-Host "検出されたエラー数: $Errors"
            Write-Host "検出された警告数: $Warnings"
            Write-Host ""
          
            # 最後の50行を出力（最終ステータス）
            Write-Host "[unity_build.log の末尾50行:]"
            Get-Content -Path "unity_build.log" -Tail 50 | ForEach-Object { Write-Host $_ }
          } else {
            Write-Host "[WARNING] unity_build.log が見つかりませんでした。"
          }
          Write-Host "::endgroup::"
        shell: powershell

      - name: Upload Unity Log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unity-build-log
          path: unity_build.log

      - name: Check Build Output
        run: |
          Write-Host "::group::ビルド成果物の検証"
          if (Test-Path $env:UNITY_BUILD_OUTPUT_DIR) {
            Write-Host "[OK] ビルド出力ディレクトリを確認: $env:UNITY_BUILD_OUTPUT_DIR"
            Write-Host ""
          
            $Items = Get-ChildItem -Path $env:UNITY_BUILD_OUTPUT_DIR -Recurse -File
            $TotalSize = ($Items | Measure-Object -Property Length -Sum).Sum
          
            Write-Host "ファイル統計:"
            Write-Host "  総ファイル数: $($Items.Count)"
            Write-Host "  総サイズ: $([Math]::Round($TotalSize / 1MB, 2)) MB"
            Write-Host ""
          
            Write-Host "ビルド成果物一覧:"
            $Items | ForEach-Object {
              $Size = [Math]::Round($_.Length / 1MB, 2)
              Write-Host "  - $($_.FullName) ($Size MB)"
            }
          
            if ($Items.Count -eq 0) {
              Write-Host "[WARNING] ビルド出力ディレクトリにファイルが見つかりません。"
            }
          } else {
            Write-Host "[ERROR] ビルド出力ディレクトリが見つかりません: $env:UNITY_BUILD_OUTPUT_DIR"
            Write-Host "[ERROR] ビルド成果物が存在しないため、圧縮処理を中断します。"
            Write-Host "::endgroup::"
            exit 1
          }
          Write-Host "::endgroup::"
        shell: powershell

      - name: Zip Build Artifacts
        run: |
          Write-Host "::group::ビルド成果物のアーカイブ（ZIP化）"
          if (-not (Test-Path $env:UNITY_BUILD_OUTPUT_DIR)) {
            Write-Host "[ERROR] ビルド出力ディレクトリが見つかりません: $env:UNITY_BUILD_OUTPUT_DIR"
            Write-Host "::endgroup::"
            exit 1
          }
          
          try {
            Write-Host "[INFO] ビルド成果物を圧縮中..."
            Compress-Archive -Path "$env:UNITY_BUILD_OUTPUT_DIR\*" -DestinationPath Builds.zip -ErrorAction Stop
          
            $ZipSize = (Get-Item "Builds.zip").Length
            Write-Host "[OK] アーカイブ（Builds.zip）の作成が完了しました。"
            Write-Host "     ファイルサイズ: $([Math]::Round($ZipSize / 1MB, 2)) MB"
          } catch {
            Write-Host "[ERROR] アーカイブ作成に失敗しました: $_"
            Write-Host "::endgroup::"
            exit 1
          }
          Write-Host "::endgroup::"
        shell: powershell

      - name: Generate Release Tag
        id: tag_gen
        run: |
          Write-Host "::group::リリース用タグ名の生成"
          
          # リポジトリ変数から現在のカウントを取得（未設定の場合は1をデフォルトにする）
          $Counter = "${{ vars.BUILD_VERSION }}"
          if (-not $Counter) { $Counter = "1" }
          
          $TagName = "dev-v1.0.$Counter"
          "TAG_NAME=$TagName" | Add-Content -Path $env:GITHUB_OUTPUT
          Write-Host "[OK] 生成されたタグ名: $TagName"
          Write-Host "::endgroup::"
        shell: powershell

      - name: Create Release and Upload Asset
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.tag_gen.outputs.TAG_NAME }}
          name: Release ${{ steps.tag_gen.outputs.TAG_NAME }}
          body: |
            Automated build generated from workflow run #${{ github.run_id }}
            
            **Trigger Event:** ${{ github.event_name }}
            ${{ github.event_name == 'pull_request' && format('**PR:** #{0}', github.event.pull_request.number) || '**Trigger:** Manual dispatch' }}
            **Timestamp:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            **Build Process:**
            1. Assets downloaded from Google Drive
            2. Unity packages imported automatically
            3. Multi-profile builds executed (Development & Master profiles)
            
            **Included Builds:**
            - Development profiles
            - Master profiles
          files: Builds.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Increment Release Counter
        if: success()
        run: |
          Write-Host "::group::リリース用カウンターのインクリメント"
          $CurrentCounter = [int]"${{ vars.BUILD_VERSION }}"
          if (-not $CurrentCounter) { $CurrentCounter = 1 }
          $NextCounter = $CurrentCounter + 1
          
          Write-Host "現在のカウンター: $CurrentCounter"
          Write-Host "次のカウンター: $NextCounter"
          
          # GitHub API を呼び出してリポジトリ変数を更新
          $Url = "https://api.github.com/repos/${{ github.repository }}/actions/variables/BUILD_VERSION"
          $Headers = @{
              "Authorization" = "Bearer ${{ secrets.VAR_UPDATE_TOKEN }}"
              "Accept"        = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
          }
          $Body = @{
              "name" = "BUILD_VERSION"
              "value" = [string]$NextCounter
          } | ConvertTo-Json
          
          try {
              $Response = Invoke-RestMethod -Uri $Url -Method PATCH -Headers $Headers -Body $Body -ContentType "application/json"
              Write-Host "[OK] BUILD_VERSION を $NextCounter に正常に更新しました。"
          } catch {
              Write-Host "[ERROR] BUILD_VERSION の更新に失敗しました: $_"
              Write-Host "::endgroup::"
              exit 1
          }
          Write-Host "::endgroup::"
        shell: powershell

      - name: Release Completion Summary
        if: always()
        run: |
          Write-Host "::group::ワークフロー実行サマリー"
          Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')] ワークフローが終了しました。"
          
          if ("${{ steps.create_release.outcome }}" -eq "success") {
            Write-Host "[OK] リリースが正常に作成されました。"
            Write-Host "     タグ名: ${{ steps.tag_gen.outputs.TAG_NAME }}"
            Write-Host "     成果物: Builds.zip をアップロードしました。"
          } else {
            Write-Host "[WARNING] リリースの作成が完了しませんでした（失敗またはスキップされた可能性があります）。"
          }
          Write-Host "::endgroup::"
        shell: powershell
