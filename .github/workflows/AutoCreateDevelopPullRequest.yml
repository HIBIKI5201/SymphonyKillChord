name: "[Git] AutoCreateDevelopPullRequest"

# feature/**/master への PR がマージされたら、master → develop の Draft PR を作る（既にあれば本文を更新する）。
# 本文は master に取り込まれた PR の本文から組み立てる。処理本体は .github/scripts/BuildDevelopPullRequest.js。

on:
  pull_request_target:
    # edited: マージ済みの PR の本文を後から直したとき（Issue の追記など）にも作り直す。
    types: [closed, edited]
    branches:
      - 'feature/**/master'
  # 自動で作られなかったとき（作業ブランチと master が同じコミットになった場合など）の手動実行用。
  workflow_dispatch:
    inputs:
      master_branch:
        description: "develop に取り込む master ブランチ（例: feature/demo/just-judgement/master）"
        required: true
        type: string

concurrency:
  group: develop-pr-${{ github.event.pull_request.base.ref || inputs.master_branch }}
  cancel-in-progress: false

jobs:
  create-draft-pull-request:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      pull-requests: write

    steps:
      - name: Validate master branch name
        env:
          MASTER_BRANCH: ${{ github.event.pull_request.base.ref || inputs.master_branch }}
        run: |
          case "$MASTER_BRANCH" in
            feature/*/master) ;;
            *) echo "::error::feature/**/master の形ではありません: $MASTER_BRANCH"; exit 1 ;;
          esac

      # スクリプトだけを取り出す。pull_request_target では、マージ済みの master（信頼できる側）の内容になる。
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Create or update draft pull request to develop
        uses: actions/github-script@v7
        env:
          MASTER_BRANCH: ${{ github.event.pull_request.base.ref || inputs.master_branch }}
        with:
          script: |
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/BuildDevelopPullRequest.js`);
            await run({ github, context, core, masterBranch: process.env.MASTER_BRANCH });
