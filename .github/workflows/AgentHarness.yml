name: Agent Harness

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.agents/skills/**'
      - '.codex/skills/**'
      - '.claude/skills/**'
      - 'Assets/Scripts/Design*.md'
      - 'Docs/agent/README.md'
      - 'scripts/harness/**'
      - '.github/workflows/AgentHarness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check entrypoint budgets, links and duplicate skills
        run: python scripts/harness/check_harness.py
      - name: Test harness validation failure cases
        run: python -m unittest discover -s scripts/harness -p 'test_*.py'
