name: "[CI/CD] Unity EditMode Tests"

# Assets/Tests/EditMode の EditMode テストを GameCI（GitHub ホストのランナー）で実行し、
# 結果（NUnit XML）を対象コミットの SHA 付きで保存する（#2361 P3・#2417 P6、2026-10-16 リードプログラマー決定）。
# Unity のライセンスは Secrets の UNITY_LICENSE・UNITY_EMAIL・UNITY_PASSWORD から読む。
# 未登録の間はテストを実行せず、注意を出して成功で終える（develop の必須チェックにするのは登録後）。
on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  # テスト結果を PR のチェック（EditMode Test Results）として出すため。
  checks: write

concurrency:
  group: editmode-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: EditMode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: ライセンスの登録を確認
        id: license
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::notice::Unity のライセンス（Secrets: UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD）が未登録のため、EditMode テストを実行しません。"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ソースを取得
        if: steps.license.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Library をキャッシュから復元
        if: steps.license.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-editmode-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-editmode-

      - name: EditMode テストを実行
        if: steps.license.outputs.available == 'true'
        id: tests
        uses: game-ci/unity-test-runner@v4
        with:
          unityVersion: auto
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results
          coverageOptions: ''

      - name: 結果を保存
        if: always() && steps.license.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: editmode-results-${{ env.TARGET_SHA }}
          path: ${{ steps.tests.outputs.artifactsPath || 'test-results' }}
          retention-days: 30
